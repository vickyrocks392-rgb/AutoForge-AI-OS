[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge-artifacts"
version = "0.1.0"
description = "Artifact Platform for AutoForge AI OS - Canonical artifact management, versioning, lineage, provenance, publishing, and rollback"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AutoForge AI"},
]
# Phase 12 constraint: stdlib + existing AutoForge packages only.
# No new frameworks. No LangChain/LangGraph/CrewAI/Temporal/Celery/Kafka/Redis/etc.
dependencies = [
    "autoforge-models",
    "autoforge-events",
    "autoforge-execution",
    "autoforge-connectors",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
