[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge-composition"
version = "0.1.0"
description = "Composition root for the AutoForge AI platform - wires Kernel, Runtime, canonical Events and the Event Platform transport together"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AutoForge AI"},
]
dependencies = [
    "autoforge-models",
    "autoforge-events",
    "autoforge-runtime",
    "autoforge-kernel",
    "autoforge-event-platform",
    "autoforge-ai-infrastructure",
    "autoforge-connectors",
    "autoforge-workflows",
    "autoforge-execution",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
