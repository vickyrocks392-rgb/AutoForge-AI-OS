[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge-workflows"
version = "0.1.0"
description = "Workflow Platform for AutoForge AI OS - DAG engine, scheduler, task queue, retry policies, recovery, and HITL approval gates"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AutoForge AI"},
]
# Phase 9 constraint: stdlib + existing AutoForge packages only.
# No Redis, Kafka, Celery, Temporal, Airflow, or similar.
dependencies = [
    "autoforge-models",
    "autoforge-events",
    "autoforge-runtime",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
